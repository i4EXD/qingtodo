plugins { id 'com.android.application' }

android {
    namespace 'com.qingtodo.app'
    compileSdk 36
    defaultConfig {
        applicationId 'com.qingtodo.app'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '1.3.0'
    }
    signingConfigs {
        personal {
            storeFile file('../signing/qingtodo-personal.jks')
            storePassword System.getenv('QINGTODO_KEYSTORE_PASSWORD')
            keyAlias 'qingtodo'
            keyPassword System.getenv('QINGTODO_KEYSTORE_PASSWORD')
        }
    }
    buildTypes {
        release {
            if (file('../signing/qingtodo-personal.jks').exists() && System.getenv('QINGTODO_KEYSTORE_PASSWORD')) {
                signingConfig signingConfigs.personal
            }
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
